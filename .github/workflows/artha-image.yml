name: Artha image (temporary)

# Temporary test build: publishes the patched 2026.9.1 gateway image to GHCR.
# Remove this workflow and the public package once testing is complete.

on:
  workflow_dispatch:
  push:
    branches:
      - artha/2026.9.1-office365

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/viplav-artha/openclaw:2026.9.1-office365
            ghcr.io/viplav-artha/openclaw:2026.9.1-office365-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: echo "digest=${{ steps.build.outputs.digest }} commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
