name: Artha OpenClaw image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artha-openclaw-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: ap-south-1
  DEPLOYMENT_PARAMETER: /artha/prod/nemoclaw/deployment
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.runtime.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # NemoClaw's reviewed dependency graph is 2026.9.1. This source includes
      # the Office365 transport; bump the immutable ref with its compatibility PR.
      - name: Checkout reviewed runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1090ebf9619d683e3a667add7de9b40bdde7a694
          path: runtime-source
          persist-credentials: false
      - id: runtime
        run: echo "commit=$(git -C runtime-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node --test runtime-source/src/agents/artha-office365-context.node-test.mjs
      - run: python3 -m unittest discover -s scripts/artha -p 'test_*.py' -v
      - run: node --test scripts/artha/verify-export.test.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ARM64 runtime without credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./runtime-source
          platforms: linux/arm64
          load: true
          tags: artha-openclaw:ci
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/Artha-Group-Tech/artha-openclaw
            org.opencontainers.image.revision=${{ steps.runtime.outputs.commit }}
          cache-from: type=gha,scope=artha-openclaw
          cache-to: type=gha,scope=artha-openclaw,mode=max
      - name: Verify exported package and required signer
        run: |
          docker run --rm --network none --entrypoint node \
            -v "$PWD/scripts/artha/verify-export.mjs:/verify-export.mjs:ro" \
            artha-openclaw:ci /verify-export.mjs /app 2026.9.1
          docker run --rm --network none --entrypoint node artha-openclaw:ci \
            -e 'if (process.platform !== "linux" || process.arch !== "arm64") throw Error("Expected native Linux ARM64 runtime")'
          docker run --rm --network none --entrypoint node artha-openclaw:ci openclaw.mjs --version
      - id: version
        run: echo "version=$(node -p 'require("./runtime-source/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.ARTHA_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ steps.runtime.outputs.commit }}
        run: |
          set -euo pipefail
          CONFIG=$(aws ssm get-parameter --name "$DEPLOYMENT_PARAMETER" --query Parameter.Value --output text)
          REPOSITORY=$(jq -r .openclaw_repository <<< "$CONFIG")
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
          TAG="$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag artha-openclaw:ci "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
          DIGEST=$(docker buildx imagetools inspect "$REPOSITORY:$TAG" --format '{{json .Manifest.Digest}}' | jq -r .)
          {
            echo "image=$REPOSITORY@$DIGEST"
            echo "repository=$REPOSITORY"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg commit "$SOURCE_SHA" --arg image "$REPOSITORY@$DIGEST" \
            '{commit:$commit,image:$image}' > openclaw-release.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        if: steps.publish.outcome == 'success'
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.publish.outcome == 'success'
        with:
          name: artha-openclaw-release
          path: openclaw-release.json

  promote:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: artha-openclaw-pin-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.ARTHA_PROMOTION_APP_ID }}
          private-key: ${{ secrets.ARTHA_PROMOTION_APP_PRIVATE_KEY }}
          owner: Artha-Group-Tech
          repositories: artha-nemoclaw
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Artha-Group-Tech/artha-nemoclaw
          ref: main
          path: nemoclaw
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
      - name: Update the reviewed dependency through a pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
          SOURCE_SHA: ${{ needs.image.outputs.commit }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          python3 scripts/artha/promote.py --checkout nemoclaw --image "$IMAGE" --commit "$SOURCE_SHA" --version "$VERSION"
          cd nemoclaw
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/$BOT_NAME" --jq .id)
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_ID+$BOT_NAME@users.noreply.github.com"
          EXPECTED=$(git ls-remote origin refs/heads/automation/openclaw-image | cut -f1)
          git checkout -B automation/openclaw-image
          git add deploy/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: update reviewed OpenClaw image'
          # This branch belongs exclusively to this serialized workflow.
          git push origin HEAD:refs/heads/automation/openclaw-image --force-with-lease="refs/heads/automation/openclaw-image:$EXPECTED"
          if ! gh pr list --head automation/openclaw-image --base main --json number --jq '.[0].number' | grep -q '[0-9]'; then
            printf '%s\n' 'Update the immutable OpenClaw export. NemoClaw compatibility checks must pass before merging; this does not deploy production.' > /tmp/pin-pr.md
            gh pr create --base main --head automation/openclaw-image --title 'build: update reviewed OpenClaw image' --body-file /tmp/pin-pr.md
          fi
